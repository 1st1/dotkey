<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keynote renderer</title>
    <!--
      No font links here on purpose. Keynote files reference fonts by name and
      embed no font data, so <Keynote> matches the deck's fonts against Google
      Fonts and loads exactly the weights it uses.
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, -apple-system, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0b0b0c;
        color: #e8e8ea;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
